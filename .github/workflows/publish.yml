name: publish

# Publishes the contract artifacts on every tag v*:
#   ui remoteEntry -> GitHub Pages dist/<version>/<name>_ui/ and dist/latest/
#   api image      -> ghcr.io/<owner>/plugin-<name>-api:<version>,latest
#   plugin tarball -> GitHub Release asset <name>-<version>.tgz (artifact.url)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: false

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: |
          V="$RAW_VERSION"
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build remote
        run: |
          pnpm --dir ui install
          pnpm --dir ui build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: dist/${{ steps.version.outputs.version }}
          keep_files: true
      - name: Publish latest to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: dist/latest
          keep_files: true

  api:
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          V="$RAW_VERSION"
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push plugin api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plugin-erxes-agent-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/plugin-erxes-agent-api:latest

  # Linux-built release tarball — the plugin host downloads this on install.
  # Building here (not locally) keeps native .node binaries Linux-compatible.
  artifact:
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          pnpm --dir api install
          pnpm --dir ui install
      - name: Pack artifact
        run: node scripts/pack.mjs
      - name: Upload release asset
        run: |
          V="$RAW_VERSION"
          V="${V#v}"
          gh release create "v${V}" --generate-notes || true
          gh release upload "v${V}" "dist-artifact/erxes-agent-${V}.tgz" --clobber
